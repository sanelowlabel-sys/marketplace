<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Polyfill/guard for environments where window.fetch has only a getter
      (function() {
        try {
          var initialFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return initialFetch;
            },
            set: function(val) {
              initialFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if window already sealed
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
